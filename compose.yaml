name: umkm-mandiri

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: ${APP_BUILD_TARGET:-dev}
  image: umkm-mandiri-app
  volumes:
    - ./:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - reverb
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-umkm_mandiri}
      MYSQL_USER: ${DB_USERNAME:-umkm_mandiri}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      TZ: Asia/Jakarta
    # Tuning untuk VPS kecil (RAM 2 GB)
    command:
      - --mysqlx=OFF
      - --default-time-zone=+07:00
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  queue:
    <<: *app
    command: [ "php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600" ]

  scheduler:
    <<: *app
    command: [ "php", "artisan", "schedule:work" ]

  reverb:
    <<: *app
    command: [ "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080" ]

  # Hanya untuk development: Vite dev server (hot reload)
  node:
    image: node:22-alpine
    working_dir: /app
    dns: [ 1.1.1.1, 8.8.8.8 ]
    volumes:
      - ./:/app
    command: [ "sh", "-c", "npm install && npm run dev -- --host 0.0.0.0" ]
    ports:
      - "5173:5173"
    profiles: [ "dev" ]

volumes:
  mysql-data:
